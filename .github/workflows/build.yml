name: Build

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GitVersion needs full history, not a shallow clone
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore SyntaxCircus.Blazor.Auth.slnx
      - run: dotnet build SyntaxCircus.Blazor.Auth.slnx --no-restore --configuration Release
